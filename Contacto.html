
    <section id="contacto"
             class="container my-5">

        <h2 class="text-center mb-4">
            Contacto
        </h2>


        <div class="row">

            <div class="col-12 col-md-8 col-lg-6 mx-auto">

                <form>


                    <!-- NOMBRE -->

                    <div class="mb-3">

                        <label for="nombre"
                               class="form-label">
                            Nombre
                        </label>

                        <input type="text"
                               id="nombre"
                               class="form-control"
                               placeholder="Ingrese su nombre">

                    </div>


                    <!-- CORREO -->

                    <div class="mb-3">

                        <label for="correo"
                               class="form-label">
                            Correo electrÃ³nico
                        </label>

                        <input type="email"
                               id="correo"
                               class="form-control"
                               placeholder="nombre@correo.com">

                    </div>
                    

                    <!-- PERSONAJE -->

                    <div class="mb-3">

                        <label for="personaje"
                               class="form-label">
                            Personaje favorito
                        </label>

                        <select id="personaje"
                                class="form-select">

                            <option>
                                Luffy
                            </option>

                            <option>
                                Zoro
                            </option>

                            <option>
                                Nami
                            </option>

                        </select>

                    </div>


                    <!-- MENSAJE -->

                    <div class="mb-3">

                        <label for="mensaje"
                               class="form-label">
                            Mensaje
                        </label>

                        <textarea id="mensaje"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Escriba su mensaje">
                        </textarea>

                    </div>


                    <!-- BOTÃ“N -->

                    <button type="submit"
                            class="btn btn-primary">
                        Enviar mensaje
                    </button>


                </form>

            </div>

        </div>

    </section>
