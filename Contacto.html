<!DOCTYPE html>
<html lang="es">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body>
<section id="contacto" class="container my-5">

    

    <!-- justify-content-center asegura el centrado de la columna -->
    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">
            <div class ="card body p-4 p-md-5">

                <h1 class="text-center fw-bold mb-4">Contacto</h1>
            <form>

                <!-- NOMBRE -->
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-semibold">Nombre</label>
                    <input type="text" id="nombre" class="form-control form-control-lg" placeholder="Ingrese su nombre">
                </div>
                <p> </p>
                <!-- CORREO -->
                <div class="mb-3">
                    <label for="correo" class="form-label fw-semibold">Correo electrónico</label>
                    <input type="email" id="correo" class="form-control form-control-lg" placeholder="nombre@correo.com">
                </div>
                <p> </p>
                <!-- PERSONAJE -->
                <div class="mb-3">
                    <label for="personaje" class="form-label fw-semihold">Personaje favorito</label>
                    <select id="personaje" class="form-select form-select-lg">
                        <option value="" disabled selected>Seleccione un personaje</option>
                        <option value="luffy">Luffy</option>
                        <option value="zoro">Zoro</option>
                        <option value="nami">Nami</option>
                    </select>
                </div>
                <p> </p>
                <!-- MENSAJE -->
                <div class="mb-3">
                    <label for="mensaje" class="form-label fw-semibold">Mensaje</label>
                    <textarea id="mensaje" class="form-control form-control-lg" rows="4" placeholder="Escriba su mensaje"></textarea>
                </div>
                <p> </p>
                <!-- BOTÓN (Alineado al centro) -->
                <div class="d-grip">
                    <button type="submit" class="btn btn-primary  btn-lg rounded-3">
                        Enviar mensaje
                    </button>
                </div>

            </form>

        </div>

    </div>

</section>

</body>
</html>
